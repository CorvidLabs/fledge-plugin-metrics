[package]
name = "fledge-plugin-metrics"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Code metrics for fledge — LOC, churn, test ratio. Uses tokei + git."
license = "MIT"
authors = ["0xLeif"]
repository = "https://github.com/CorvidLabs/fledge-plugin-metrics"

[[bin]]
name = "fledge-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokei = { version = "14", default-features = false }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
